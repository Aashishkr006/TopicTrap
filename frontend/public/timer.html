<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer — TopicTrap</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0a0f; --surface: #13131a; --border: rgba(255,255,255,0.08); --text: #f0ede8; --muted: rgba(240,237,232,0.5); --accent: #e8c547; --accent2: #ff6b6b; --green: #6bffb8; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .timer-wrap { text-align: center; padding: 40px; }
    .timer-huge { font-family: 'Playfair Display', serif; font-size: 120px; font-weight: 900; letter-spacing: -4px; color: var(--text); transition: color 0.3s; }
    .timer-huge.urgent { color: var(--accent2); }
    .timer-huge.done { color: var(--green); }
    .timer-sub { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin: 8px 0 32px; }
    .presets { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
    .preset { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 8px 20px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; transition: all 0.2s; }
    .preset.active, .preset:hover { border-color: var(--accent); color: var(--accent); }
    .controls { display: flex; gap: 12px; justify-content: center; }
    .btn { padding: 16px 40px; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; border: none; }
    .btn-primary { background: var(--accent); color: #0a0a0f; }
    .btn-primary:hover { box-shadow: 0 8px 24px rgba(232,197,71,0.3); }
    .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    a { color: var(--muted); font-size: 13px; text-decoration: none; position: fixed; top: 24px; left: 24px; }
    a:hover { color: var(--text); }
  </style>
</head>
<body>
  <a href="/">← Back</a>
  <div class="timer-wrap">
    <div class="timer-huge" id="display">1:00</div>
    <div class="timer-sub" id="sub">Ready</div>
    <div class="presets">
      <button class="preset" onclick="setTime(30)">30s</button>
      <button class="preset active" onclick="setTime(60)">1 min</button>
      <button class="preset" onclick="setTime(120)">2 min</button>
      <button class="preset" onclick="setTime(180)">3 min</button>
      <button class="preset" onclick="setTime(300)">5 min</button>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="startBtn" onclick="toggle()">▶ Start</button>
      <button class="btn btn-ghost" onclick="reset()">↺ Reset</button>
    </div>
  </div>
  <script>
    let total = 60, current = 60, running = false, iv = null;
    function fmt(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }
    function setTime(s) { total = s; current = s; running = false; clearInterval(iv); document.getElementById('startBtn').textContent = '▶ Start'; document.getElementById('sub').textContent = 'Ready'; render(); document.querySelectorAll('.preset').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); }
    function render() { const el = document.getElementById('display'); el.textContent = fmt(current); el.className = 'timer-huge' + (current<=10&&running?' urgent':'') + (current===0?' done':''); }
    function toggle() { if(running){clearInterval(iv);running=false;document.getElementById('startBtn').textContent='▶ Resume';document.getElementById('sub').textContent='Paused';return;} if(current===0){reset();return;} running=true; document.getElementById('startBtn').textContent='⏸ Pause'; document.getElementById('sub').textContent='Go!'; iv=setInterval(()=>{current--;render();if(current===0){clearInterval(iv);running=false;document.getElementById('startBtn').textContent='▶ Start';document.getElementById('sub').textContent="Time's up!"}},1000); }
    function reset() { clearInterval(iv); running=false; current=total; document.getElementById('startBtn').textContent='▶ Start'; document.getElementById('sub').textContent='Ready'; render(); }
    render();
  </script>
</body>
</html>
